name: cloudcart

on:
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
     matrix:
      service:
        - frontend
        - auth-service
        - product-service
        - cart-service
        - order-service
        - payment-service
        - api-gateway

      steps:
         - name: Checkout Repository
           uses: actions/checkout@v4

         - name: Set up Docker Buildx
           uses: docker/setup-buildx-action@v3

         - name: Login to Docker Hub
           uses: docker/login-action@v3

           with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}
         - name: Set Docker Context
           id: vars
           run: |
            if [ "${{ matrix.service }}" = "frontend" ]; then
              echo "context=./frontend" >> $GITHUB_OUTPUT
              echo "dockerfile=./frontend/Dockerfile" >> $GITHUB_OUTPUT
              echo "image=cloudcart-frontend" >> $GITHUB_OUTPUT

            elif [ "${{ matrix.service }}" = "api-gateway" ]; then
                echo "context=./services/shared" >> $GITHUB_OUTPUT
                echo "dockerfile=./services/shared/Dockerfile.gateway" >> $GITHUB_OUTPUT
                echo "image=cloudcart-api-gateway" >> $GITHUB_OUTPUT
            else
              echo "context=./services/${{ matrix.service }}" >> $GITHUB_OUTPUT
              echo "dockerfile=./services/${{ matrix.service }}/Dockerfile" >> $GITHUB_OUTPUT
              echo "image=cloudcart-${{ matrix.service }}" >> $GITHUB_OUTPUT
            fi

            - name: Build and Push Docker Image
            uses: docker/build-push-action@v5
            with:
           context: ${{ steps.vars.outputs.context }}
           file: ${{ steps.vars.outputs.dockerfile }}
           push: true
           tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ steps.vars.outputs.image }}:latest
